services:
  - type: web
    name: ai-interview-copilot-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.16
      - key: MODEL_NAME
        value: openai/gpt-oss-20b
      - key: GROQ_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false

